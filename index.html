<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DeepBoost — Performance Marketing & Digital Growth</title>

  <meta
    name="description"
    content="DeepBoost helps businesses grow through Meta Ads, lead generation, social media and performance marketing."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #070707;
      color: #fff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: #fff;
      color: #000;
    }

    /* NAVBAR */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      transition: 0.3s ease;
    }

    header.scrolled {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav {
      max-width: 1280px;
      margin: auto;
      padding: 20px 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 130px;
      max-height: 45px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.6);
    }

    nav {
      display: flex;
      gap: 34px;
    }

    nav a {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      transition: 0.2s ease;
    }

    nav a:hover {
      color: #fff;
    }

    .nav-btn {
      background: #fff;
      color: #000;
      padding: 12px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      transition: 0.3s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 10px 16px;
      border-radius: 50px;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      opacity: 0.07;

      background-image:
        linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px);

      background-size: 70px 70px;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(128, 60, 255, 0.13);
      filter: blur(140px);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .hero-content {
      position: relative;
      width: 100%;
      max-width: 1280px;
      margin: auto;
      padding: 160px 30px 100px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 9px 15px;
      border-radius: 50px;

      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);

      color: rgba(255,255,255,0.65);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #5cff87;
      border-radius: 50%;
      box-shadow: 0 0 15px #5cff87;
    }

    .hero h1 {
      margin-top: 30px;
      max-width: 1000px;

      font-size: clamp(60px, 10vw, 120px);
      line-height: 0.92;
      letter-spacing: -7px;
      font-weight: 900;
    }

    .muted {
      color: rgba(255,255,255,0.3);
    }

    .hero-description {
      margin-top: 35px;
      max-width: 650px;

      color: rgba(255,255,255,0.5);
      font-size: 19px;
      line-height: 1.8;
    }

    .hero-buttons {
      display: flex;
      gap: 14px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      padding: 15px 25px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.3s ease;
    }

    .primary-btn {
      background: #fff;
      color: #000;
    }

    .secondary-btn {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.03);
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-3px);
    }

    /* METRICS */

    .metrics {
      margin-top: 100px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      max-width: 850px;
    }

    .metric {
      border-left: 1px solid rgba(255,255,255,0.12);
      padding-left: 20px;
    }

    .metric strong {
      font-size: 25px;
      display: block;
    }

    .metric span {
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      margin-top: 5px;
      display: block;
    }

    /* GENERAL */

    section {
      position: relative;
    }

    .container {
      max-width: 1280px;
      margin: auto;
      padding: 120px 30px;
    }

    .section-dark {
      background: rgba(255,255,255,0.025);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.3);
      font-weight: 700;
    }

    .section-title {
      margin-top: 20px;
      font-size: clamp(42px, 6vw, 75px);
      letter-spacing: -4px;
      line-height: 1;
      font-weight: 900;
      max-width: 850px;
    }

    .section-description {
      margin-top: 25px;
      color: rgba(255,255,255,0.4);
      max-width: 650px;
      line-height: 1.8;
      font-size: 17px;
    }

    /* INTRO */

    .intro {
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.025);
    }

    .intro-text {
      max-width: 1050px;
      font-size: clamp(30px, 5vw, 60px);
      line-height: 1.1;
      letter-spacing: -2px;
      color: rgba(255,255,255,0.65);
    }

    .intro-text strong {
      color: #fff;
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 45px 0 30px;
    }

    .filter {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5);
      padding: 10px 17px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter.active {
      background: #fff;
      color: #000;
    }

    /* WORK */

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .work-card {
      min-height: 430px;
      padding: 35px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.1);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.07),
          rgba(255,255,255,0.015)
        );

      position: relative;
      overflow: hidden;

      transition: 0.5s ease;
    }

    .work-card::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -100px;
      top: -100px;
      background: rgba(255,255,255,0.04);
      filter: blur(60px);
      border-radius: 50%;
    }

    .work-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255,255,255,0.25);
    }

    .work-number {
      color: rgba(255,255,255,0.25);
      font-size: 13px;
    }

    .work-category {
      float: right;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 7px 11px;
      border-radius: 30px;
      font-size: 10px;
      color: rgba(255,255,255,0.45);
    }

    .work-content {
      position: absolute;
      left: 35px;
      right: 35px;
      bottom: 35px;
      z-index: 2;
    }

    .work-content h3 {
      font-size: 38px;
      letter-spacing: -2px;
    }

    .work-result {
      color: rgba(255,255,255,0.4);
      margin-top: 7px;
    }

    .work-content p {
      color: rgba(255,255,255,0.45);
      line-height: 1.7;
      margin-top: 20px;
      max-width: 520px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .tag {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.45);
      padding: 7px 10px;
      border-radius: 30px;
      font-size: 10px;
    }

    /* SERVICES */

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: rgba(255,255,255,0.1);
      margin-top: 60px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      overflow: hidden;
    }
