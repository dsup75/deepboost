      if (!value || value === "-") return 0;
      const normalized = String(value).replace(",", "").trim();
      if (normalized.endsWith("M")) return parseFloat(normalized) * 1000000;
      if (normalized.endsWith("K")) return parseFloat(normalized) * 1000;
      return Number(normalized) || 0;

        goldLight.position.set(5, 6, 6);
        scene.add(goldLight);

        const cyanLight = new THREE.PointLight(0x00E5FF, 3, 30);
        cyanLight.position.set(-5, -2, 5);
        scene.add(cyanLight);

        const group = new THREE.Group();

        const coreGeo = new THREE.IcosahedronGeometry(2.2, 2);
        const coreMat = new THREE.MeshPhysicalMaterial({
          color: 0x11152A,
          metalness: 0.55,
          roughness: 0.16,
          clearcoat: 1,
          transmission: 0.08,
          emissive: 0x11152A
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        group.add(core);

        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xF5C86A,
          transparent: true,
          opacity: 0.36
        });

        for (let i = 0; i < 3; i++) {
          const ringGeo = new THREE.TorusGeometry(3.1 + i * 0.45, 0.012, 16, 180);
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2 + i * 0.48;
          ring.rotation.y = i * 0.75;
          group.add(ring);
        }

        const particleGeo = new THREE.BufferGeometry();
        const count = 240;
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i++) {
          positions[i] = (Math.random() - 0.5) * 14;
        }

        particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

        const particles = new THREE.Points(
          particleGeo,
          new THREE.PointsMaterial({
            size: 0.045,
            color: 0x00E5FF,
            transparent: true,
            opacity: 0.75
          })
        );

        group.add(particles);
        scene.add(group);

        let mouseX = 0;
        let mouseY = 0;

        const handleMouseMove = (event) => {
          mouseX = (event.clientX / window.innerWidth - 0.5) * 0.7;
          mouseY = (event.clientY / window.innerHeight - 0.5) * 0.5;
        };

        window.addEventListener("mousemove", handleMouseMove);

        let frameId;

        const animate = () => {
          frameId = requestAnimationFrame(animate);
          core.rotation.x += 0.0035;
          core.rotation.y += 0.006;
          particles.rotation.y += 0.0015;
          group.rotation.y += (mouseX - group.rotation.y) * 0.03;
          group.rotation.x += (mouseY - group.rotation.x) * 0.03;
          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };

        window.addEventListener("resize", handleResize);

        return () => {
          window.removeEventListener("mousemove", handleMouseMove);
          window.removeEventListener("resize", handleResize);
          cancelAnimationFrame(frameId);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, []);

      return <div ref={mountRef} className="h-full min-h-[430px] w-full" />;
    };

    const PerformanceBars = () => {
      const mountRef = useRef(null);
      const [hovered, setHovered] = useState(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        const width = container.clientWidth;
        const height = container.clientHeight;

        const camera = new THREE.PerspectiveCamera(46, width / height, 0.1, 1000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.55));

        const light = new THREE.DirectionalLight(0xffffff, 1.6);
        light.position.set(6, 10, 8);
        scene.add(light);

        const group = new THREE.Group();
        const bars = [];

        CLIENTS_DATA.forEach((client, index) => {
          const heightVal = Math.max(0.45, ((client.leadsRaw || 15) / 719) * 6);
          const geometry = new THREE.BoxGeometry(0.82, heightVal, 0.82);
          const material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(client.accent),
            emissive: new THREE.Color(client.accent),
            emissiveIntensity: 0.22,
            metalness: 0.55,
            roughness: 0.18
          });

          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(-7 + index * 2, -2.4 + heightVal / 2, 0);
          mesh.userData = client;
          group.add(mesh);
          bars.push(mesh);
        });

        const grid = new THREE.GridHelper(20, 20, 0x00E5FF, 0xF5C86A);
        grid.position.y = -2.4;
        grid.material.opacity = 0.16;
        grid.material.transparent = true;
        group.add(grid);

        scene.add(group);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const handlePointerMove = (event) => {
          const rect = container.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects(bars);
          setHovered(hits.length ? hits[0].object.userData : null);
        };

        container.addEventListener("mousemove", handlePointerMove);

        let frameId;

        const animate = () => {
          frameId = requestAnimationFrame(animate);
          group.rotation.y = Math.sin(Date.now() * 0.0008) * 0.22;
          renderer.render(scene, camera);
        };

        animate();

        const handleResize = () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };

        window.addEventListener("resize", handleResize);

        return () => {
          container.removeEventListener("mousemove", handlePointerMove);
          window.removeEventListener("resize", handleResize);
          cancelAnimationFrame(frameId);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, []);

      return (
        <div className="relative h-[360px] overflow-hidden rounded-[2rem] glass premium-border">
          <div ref={mountRef} className="h-full w-full cursor-crosshair" />
          <div className="absolute left-5 top-5">

          {hovered ? (

              <div className="font-bold text-soft-white">{hovered.name}</div>
              <div className="mt-1 font-mono text-[10px] uppercase tracking-wider text-soft-muted">{hovered.industry}</div>
              <div className="mt-3 grid grid-cols-2 gap-3 font-mono text-xs">
                <span>Spend <b className="text-champagne-500">{hovered.spend}</b></span>
                <span>Leads <b className="text-aurora-mint">{hovered.leads}</b></span>
                <span>CPL <b className="text-aurora-cyan">{hovered.cpl}</b></span>
                <span>CTR <b className="text-soft-white">{hovered.ctr}</b></span>
              </div>
            </div>
          ) : (
